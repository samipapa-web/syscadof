<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SYSCADOF - Revue</title>

<style>
html, body { margin:0; padding:0; font-family: Arial; background:#f3f4f6; }

/* Bannière */
.banniere-container {
    position: fixed;
    top:0; left:0; width:100%;
    z-index:1000;
}
.banniere-container img {
    width:100%;
}

/* Variable dynamique */
:root { --banner-height:0px; }

/* Sidebar */
.sidebar {
    position: fixed;
    top: var(--banner-height);
    left:0;
    bottom:0;
    width:110px;
    background:#1e293b;
}
.sidebar a {
    display:block;
    margin:10px;
    padding:10px;
    color:white;
    text-decoration:none;
    background:#127291;
    border-radius:4px;
}

/* Contenu */
.main {
    margin-left:110px;
    padding:20px;
    padding-top: calc(20px + var(--banner-height));
}

/* Bouton */
button {
    background:#2099b6;
    color:white;
    border:none;
    padding:8px;
    cursor:pointer;
}
button:hover { background:#167d94; }

/* Synthèse */
.synthese {
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:6px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* Tableau */
table {
    width:100%;
    border-collapse: collapse;
    margin-top:10px;
}
th, td {
    border:1px solid #ddd;
    padding:6px;
    text-align:right;
}
th {
    background:#127291;
    color:white;
}
td:first-child, th:first-child {
    text-align:left;
}
</style>
</head>

<body>

<!-- Bannière -->
<div class="banniere-container">
    <img src="{{ url_for('static', filename='images/revue.jpg') }}">
</div>

<!-- Sidebar -->
<aside class="sidebar">
    <a href="/">Accueil</a>
    <a href="/revue">Revue</a>
</aside>

<!-- Contenu -->
<div class="main">

<h3>Filtre par NIU, CRI ou UG</h3>

<input type="text" id="niu" placeholder="NIU">
<select id="cri"></select>
<select id="centre"></select>

<br><br>

<!-- 🔥 NOUVEAU -->
<input type="text" id="cle" placeholder="Mot-clé fichier">

<br><br>

<button onclick="executer()">Executer</button>

<div id="log"></div>

<!-- ========================= -->
<!-- 🔥 SYNTHESE -->
<!-- ========================= -->
<div id="blocSynthese" class="synthese" style="display:none;">
    <h3>📊 Synthèse globale</h3>
    <div id="resume"></div>

    <h4>Détail par fichier</h4>
    <table id="tableDetail">
        <thead>
            <tr>
                <th>Fichier</th>
                <th>Lignes</th>
                <th>Écart</th>
                <th>Principal des taxes</th>
                <th>Pénalités</th>
                <th>Total des taxes</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</div>

<script>

// Bannière dynamique
function adjustLayout() {
    const banner = document.querySelector(".banniere-container");
    if (banner) {
        document.documentElement.style.setProperty(
            "--banner-height",
            banner.offsetHeight + "px"
        );
    }
}
window.addEventListener("load", adjustLayout);
window.addEventListener("resize", adjustLayout);

// Init
document.addEventListener("DOMContentLoaded", async () => {
    const res = await fetch("/revue/api/init");
    const data = await res.json();

    remplir("cri", data.cris);
    remplir("centre", data.centres);
});

function remplir(id, data){
    const el = document.getElementById(id);
    el.innerHTML = "<option value=''>--</option>";
    data.forEach(x => el.innerHTML += `<option>${x}</option>`);
}

// Format nombre
function format(n){
    return Number(n || 0).toLocaleString("fr-FR");
}

// EXECUTION
async function executer(){

    const payload = {
        niu: document.getElementById("niu").value,
        cri: document.getElementById("cri").value,
        centre: document.getElementById("centre").value,
        cle: document.getElementById("cle").value
    };

    const log = document.getElementById("log");
    log.innerText = "⏳ traitement...";

    document.getElementById("blocSynthese").style.display = "none";

    const res = await fetch("/revue/api/run", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
    });

    const r = await res.json();

    if(r.success){

        log.innerHTML = `
            ✅ ${r.message}<br><br>
            <a href="/revue/download/${r.excel}" target="_blank">📥 Excel</a><br>
            <a href="/revue/download/${r.docx}" target="_blank">📄 Word</a>
        `;

        // 🔥 AFFICHAGE SYNTHESE
        afficherSynthese(r);

    } else {
        log.innerText = "❌ " + r.message;
    }
}

// ============================
// 🔥 AFFICHAGE SYNTHESE
// ============================
function afficherSynthese(r){

    const s = r.synthese;
    const detail = r.detail_par_fichier;

    document.getElementById("blocSynthese").style.display = "block";

    document.getElementById("resume").innerHTML = `
        <b>Nombre de cas :</b> ${format(s.total_lignes)}<br>
        <b>Nombre de croisements :</b> ${format(s.total_fichiers)}<br>
        <b>Ecart global :</b> ${format(s.total_ecart)}<br>
        <b>Principal des impots et taxes :</b> ${format(s.total_tax_princi)}<br>
        <b>Pénalités :</b> ${format(s.total_tax_penal)}<br>
        <b>Total des impots et taxes  :</b> ${format(s.total_tax_total)}
    `;

    const tbody = document.querySelector("#tableDetail tbody");
    tbody.innerHTML = "";

    detail.forEach(d => {
        tbody.innerHTML += `
            <tr>
                <td>${d.FICHIER}</td>
                <td>${format(d.lignes)}</td>
                <td>${format(d.ecart)}</td>
                <td>${format(d.tax_princi)}</td>
                <td>${format(d.tax_penal)}</td>
                <td>${format(d.tax_total)}</td>
            </tr>
        `;
    });
}

</script>

</body>
</html>
